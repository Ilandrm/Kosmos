<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collecteur d'Étoiles</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        
        body {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            min-height: 100vh;
            color: white;
            background: 
                radial-gradient(circle at 50% 50%, rgba(0, 41, 102, 0.3) 0%, transparent 100%),
                radial-gradient(circle at 20% 30%, rgba(128, 0, 255, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 209, 255, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 60% 40%, rgba(238, 130, 238, 0.3) 0%, transparent 60%),
                linear-gradient(45deg, #000428 0%, #140028 30%, #1B004B 70%, #002447 100%);
            overflow: hidden;
        }

        .header {
            text-align: center;
            padding: 20px;
            z-index: 2;
        }

        .title {
            font-size: 2.5em;
            color: #00d1ff;
            text-shadow: 0 0 10px rgba(0, 209, 255, 0.5);
            margin: 0;
        }
        
        .progress-container {
            width: 300px;
            height: 20px;
            background-color: rgba(0, 20, 50, 0.5);
            border: 2px solid #00d1ff;
            border-radius: 10px;
            margin: 10px auto;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #00d1ff, #00a0ff);
            transition: width 0.3s ease;
        }

        .score-display {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 1.5em;
            color: #00d1ff;
            text-shadow: 0 0 10px rgba(0, 209, 255, 0.5);
            z-index: 2;
        }

        #game-container {
            width: 800px;
            height: 600px;
            margin: 0 auto;
            position: relative;
            background: rgba(0, 20, 50, 0.3);
            border: 2px solid #00d1ff;
            border-radius: 10px;
            overflow: hidden;
        }

        #player {
            position: absolute;
            width: 60px;
            height: 60px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="%23CCCCCC"/><stop offset="50%" stop-color="%23999999"/><stop offset="100%" stop-color="%23666666"/></linearGradient><linearGradient id="window" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="%2399CCFF"/><stop offset="100%" stop-color="%233366CC"/></linearGradient><filter id="glow" height="300%" width="300%" x="-75%" y="-75%"><feMorphology operator="dilate" radius="2" in="SourceAlpha" result="thicken" /><feGaussianBlur in="thicken" stdDeviation="4" result="blurred" /><feFlood flood-color="%2399CCFF" result="glowColor" /><feComposite in="glowColor" in2="blurred" operator="in" result="softGlow_colored" /><feMerge><feMergeNode in="softGlow_colored"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><path d="M50 10 L65 40 L50 35 L35 40 Z" fill="url(%23metal)" stroke="%23444444" stroke-width="1"/><path d="M35 40 L25 75 L50 60 L75 75 L65 40" fill="%23888888" stroke="%23444444" stroke-width="1"/><path d="M30 75 L40 65 L50 85 L60 65 L70 75" fill="%23777777" stroke="%23444444" stroke-width="0.5"/><circle cx="50" cy="30" r="6" fill="url(%23window)" filter="url(%23glow)"/><path d="M37 42 L50 38 L63 42 L60 50 L40 50 Z" fill="%23AAAAAA" stroke="%23444444" stroke-width="0.5"/><path d="M25 42 L35 40 L33 55 L15 60 Z" fill="%23999999" stroke="%23444444" stroke-width="0.5"/><path d="M75 42 L65 40 L67 55 L85 60 Z" fill="%23999999" stroke="%23444444" stroke-width="0.5"/><path d="M40 50 L35 65 L50 60 L65 65 L60 50" fill="%23777777" stroke="%23444444" stroke-width="0.5"/><circle cx="50" cy="45" r="3" fill="%23555555" stroke="%23333333" stroke-width="0.5"/><circle cx="42" cy="45" r="2" fill="%23555555" stroke="%23333333" stroke-width="0.3"/><circle cx="58" cy="45" r="2" fill="%23555555" stroke="%23333333" stroke-width="0.3"/><path d="M28 60 L33 55 L30 70" fill="none" stroke="%23444444" stroke-width="0.5"/><path d="M72 60 L67 55 L70 70" fill="none" stroke="%23444444" stroke-width="0.5"/><path d="M40 50 L37 42 M60 50 L63 42" fill="none" stroke="%23555555" stroke-width="0.5"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            cursor: none;
            transition: transform 0.1s;
            filter: drop-shadow(0 0 8px rgba(150, 150, 255, 0.5));
            z-index: 2;
        }

        .star {
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #00d1ff;
            animation: twinkle 1s infinite alternate;
        }

        .asteroid {
            position: absolute;
            width: 30px;
            height: 30px;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><radialGradient id="rock" cx="50%" cy="50%" r="50%" fx="30%" fy="30%"><stop offset="0%" stop-color="%23A0522D"/><stop offset="70%" stop-color="%238B4513"/><stop offset="100%" stop-color="%23654321"/></radialGradient></defs><path d="M50,5 C70,10 90,30 95,50 C100,70 80,90 60,95 C40,100 10,80 5,60 C0,40 30,0 50,5 Z" fill="url(%23rock)" stroke="%23654321" stroke-width="2"/><circle cx="30" cy="30" r="10" fill="%23654321" opacity="0.6"/><circle cx="70" cy="40" r="15" fill="%23654321" opacity="0.5"/><circle cx="40" cy="70" r="12" fill="%23654321" opacity="0.7"/><circle cx="65" cy="65" r="8" fill="%23654321" opacity="0.6"/><circle cx="25" cy="50" r="6" fill="%23654321" opacity="0.5"/><path d="M30,25 L34,32 L27,35 Z" fill="%23A0522D" opacity="0.7"/><path d="M60,30 L68,35 L65,42 Z" fill="%23A0522D" opacity="0.8"/><path d="M40,60 L35,70 L45,72 Z" fill="%23A0522D" opacity="0.6"/></svg>');
            background-size: cover;
            border-radius: 0;
            filter: drop-shadow(0 0 8px rgba(139, 69, 19, 0.7));
        }

        .background-star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle 3s infinite;
        }

        .shooting-star {
            position: absolute;
            width: 2px;
            height: 100px;
            background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, #ffffff 50%, rgba(255,255,255,0) 100%);
            opacity: 0;
            transform: rotate(45deg);
            animation: shoot 3s linear infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        @keyframes shoot {
            0% {
                transform: translateX(-100px) translateY(-100px) rotate(45deg);
                opacity: 1;
            }
            100% {
                transform: translateX(1000px) translateY(1000px) rotate(45deg);
                opacity: 0;
            }
        }

        .game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 20, 50, 0.9);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #00d1ff;
            text-align: center;
            z-index: 10;
        }

        button {
            font-family: 'Orbitron', sans-serif;
            padding: 10px 20px;
            font-size: 1.2em;
            color: white;
            background: linear-gradient(45deg, #003a66, #00588f);
            border: 2px solid #00d1ff;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        button:hover {
            background: #00d1ff;
            color: #000428;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="title">Collecteur d'Étoiles</h1>
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
    </div>
    <div class="score-display">
        Score: <span id="score">0</span> / 200
        <div style="font-size: 0.8em; margin-top: 5px;">Objectif: Collectez 20 étoiles pour gagner!</div>
    </div>
    <div id="game-container">
        <div id="player"></div>
    </div>
    <div class="game-over">
        <h2 id="game-result">Game Over!</h2>
        <p>Score final: <span id="final-score">0</span></p>
        <p id="win-message" style="display: none; color: #00d1ff; font-weight: bold;">Félicitations, vous avez gagné !</p>
        <button onclick="restartGame()">Rejouer</button>
    </div>

    <script>
        let score = 0;
        let isGameOver = false;
        let playerEl = document.getElementById('player');
        let gameContainer = document.getElementById('game-container');
        let stars = [];
        let asteroids = [];

        // Gestion du mouvement du joueur
        let playerPos = { x: 400, y: 300 };
        let targetPos = { x: 400, y: 300 };

        function movePlayer(e) {
            if (isGameOver) return;
            
            const rect = gameContainer.getBoundingClientRect();
            targetPos.x = e.clientX - rect.left - playerEl.offsetWidth / 2;
            targetPos.y = e.clientY - rect.top - playerEl.offsetHeight / 2;

            // Limites du conteneur
            targetPos.x = Math.max(0, Math.min(targetPos.x, gameContainer.offsetWidth - playerEl.offsetWidth));
            targetPos.y = Math.max(0, Math.min(targetPos.y, gameContainer.offsetHeight - playerEl.offsetHeight));
        }

        function updatePlayerPosition() {
            // Mouvement fluide
            playerPos.x += (targetPos.x - playerPos.x) * 0.1;
            playerPos.y += (targetPos.y - playerPos.y) * 0.1;

            playerEl.style.left = `${playerPos.x}px`;
            playerEl.style.top = `${playerPos.y}px`;

            // Rotation du vaisseau
            const angle = Math.atan2(targetPos.y - playerPos.y, targetPos.x - playerPos.x);
            playerEl.style.transform = `rotate(${angle * 180 / Math.PI + 90}deg)`;
        }

        // Création d'étoiles à collecter
        function createStar() {
            if (isGameOver) return;

            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = `${Math.random() * (gameContainer.offsetWidth - 20)}px`;
            star.style.top = `${Math.random() * (gameContainer.offsetHeight - 20)}px`;
            gameContainer.appendChild(star);
            stars.push(star);

            // Suppression après un délai
            setTimeout(() => {
                if (star.parentNode === gameContainer) {
                    gameContainer.removeChild(star);
                    stars = stars.filter(s => s !== star);
                }
            }, 5000);
        }

        // Création d'astéroïdes
        function createAsteroid() {
            if (isGameOver) return;

            const asteroid = document.createElement('div');
            asteroid.className = 'asteroid';
            
            // Variation de taille pour les astéroïdes
            const size = 20 + Math.random() * 30;
            asteroid.style.width = `${size}px`;
            asteroid.style.height = `${size}px`;
            
            // Rotation aléatoire pour plus de variété
            const rotation = Math.random() * 360;
            asteroid.style.transform = `rotate(${rotation}deg)`;
            
            // Position de départ aléatoire sur les bords
            let startPos = Math.random() * 2 * (gameContainer.offsetWidth + gameContainer.offsetHeight);
            let x, y, velocityX, velocityY;
            
            if (startPos < gameContainer.offsetWidth) {
                x = startPos;
                y = -30;
                velocityX = (Math.random() - 0.5) * 4;
                velocityY = 2 + Math.random() * 2;
            } else if (startPos < gameContainer.offsetWidth + gameContainer.offsetHeight) {
                x = gameContainer.offsetWidth + 30;
                y = startPos - gameContainer.offsetWidth;
                velocityX = -(2 + Math.random() * 2);
                velocityY = (Math.random() - 0.5) * 4;
            } else if (startPos < 2 * gameContainer.offsetWidth + gameContainer.offsetHeight) {
                x = startPos - (gameContainer.offsetWidth + gameContainer.offsetHeight);
                y = gameContainer.offsetHeight + 30;
                velocityX = (Math.random() - 0.5) * 4;
                velocityY = -(2 + Math.random() * 2);
            } else {
                x = -30;
                y = startPos - (2 * gameContainer.offsetWidth + gameContainer.offsetHeight);
                velocityX = 2 + Math.random() * 2;
                velocityY = (Math.random() - 0.5) * 4;
            }

            asteroid.style.left = `${x}px`;
            asteroid.style.top = `${y}px`;
            
            asteroid.velocityX = velocityX;
            asteroid.velocityY = velocityY;
            
            // Vitesse de rotation aléatoire
            asteroid.rotationSpeed = (Math.random() - 0.5) * 2;
            
            gameContainer.appendChild(asteroid);
            asteroids.push(asteroid);
        }

        // Mise à jour des positions des astéroïdes
        function updateAsteroids() {
            for (let asteroid of asteroids) {
                const x = parseFloat(asteroid.style.left);
                const y = parseFloat(asteroid.style.top);
                
                asteroid.style.left = `${x + asteroid.velocityX}px`;
                asteroid.style.top = `${y + asteroid.velocityY}px`;
                
                // Rotation progressive de l'astéroïde
                const currentRotation = asteroid.style.transform ? 
                    parseFloat(asteroid.style.transform.replace(/[^0-9.]/g, '')) || 0 : 0;
                asteroid.style.transform = `rotate(${currentRotation + asteroid.rotationSpeed}deg)`;

                // Suppression si hors écran
                if (x < -50 || x > gameContainer.offsetWidth + 50 ||
                    y < -50 || y > gameContainer.offsetHeight + 50) {
                    gameContainer.removeChild(asteroid);
                    asteroids = asteroids.filter(a => a !== asteroid);
                }
            }
        }

        // Vérification des collisions de manière plus précise
        function checkCollisions() {
            const playerRect = playerEl.getBoundingClientRect();
            
            // Ajustement de la hitbox du vaisseau à 80% de sa taille visuelle
            const playerHitbox = {
                left: playerRect.left + playerRect.width * 0.1,
                right: playerRect.right - playerRect.width * 0.1,
                top: playerRect.top + playerRect.height * 0.1,
                bottom: playerRect.bottom - playerRect.height * 0.1,
                width: playerRect.width * 0.8,
                height: playerRect.height * 0.8
            };

            // Collisions avec les étoiles
            for (let star of stars) {
                const starRect = star.getBoundingClientRect();
                if (isColliding(playerHitbox, starRect)) {
                    gameContainer.removeChild(star);
                    stars = stars.filter(s => s !== star);
                    score += 10;
                    document.getElementById('score').textContent = score;
                    
                    // Mettre à jour la barre de progression
                    const progressPercent = (score / 200) * 100;
                    document.getElementById('progress-bar').style.width = `${progressPercent}%`;
                    
                    // Vérifier si le joueur a atteint 200 points (20 étoiles)
                    if (score >= 200) {
                        winGame();
                    }
                }
            }

            // Collisions avec les astéroïdes
            for (let asteroid of asteroids) {
                const asteroidRect = asteroid.getBoundingClientRect();
                
                // Ajustement de la hitbox de l'astéroïde pour plus de précision
                const asteroidHitbox = {
                    left: asteroidRect.left + asteroidRect.width * 0.2,
                    right: asteroidRect.right - asteroidRect.width * 0.2,
                    top: asteroidRect.top + asteroidRect.height * 0.2,
                    bottom: asteroidRect.bottom - asteroidRect.height * 0.2,
                    width: asteroidRect.width * 0.6,
                    height: asteroidRect.height * 0.6
                };
                
                if (isCollidingPrecise(playerHitbox, asteroidHitbox)) {
                    gameOver();
                }
            }
        }

        function isColliding(rect1, rect2) {
            return !(rect1.right < rect2.left || 
                    rect1.left > rect2.right || 
                    rect1.bottom < rect2.top || 
                    rect1.top > rect2.bottom);
        }
        
        // Fonction de collision plus précise basée sur la distance entre les centres
        function isCollidingPrecise(rect1, rect2) {
            // Calculer les centres
            const center1 = {
                x: rect1.left + rect1.width / 2,
                y: rect1.top + rect1.height / 2
            };
            
            const center2 = {
                x: rect2.left + rect2.width / 2,
                y: rect2.top + rect2.height / 2
            };
            
            // Calculer la distance entre les centres
            const dx = center1.x - center2.x;
            const dy = center1.y - center2.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            // Calculer le rayon minimum requis pour une collision
            const minDistance = (rect1.width + rect2.width) / 4;
            
            // Retourner vrai seulement si la distance est suffisamment petite
            return distance < minDistance;
        }

        // Game Over
        function gameOver() {
            isGameOver = true;
            document.getElementById('game-result').textContent = "Game Over!";
            document.getElementById('final-score').textContent = score;
            document.getElementById('win-message').style.display = 'none';
            document.querySelector('.game-over').style.display = 'block';
        }
        
        // Win Game
        function winGame() {
            isGameOver = true;
            document.getElementById('game-result').textContent = "Victoire!";
            document.getElementById('final-score').textContent = score;
            document.getElementById('win-message').style.display = 'block';
            document.querySelector('.game-over').style.display = 'block';
        }

        // Redémarrage du jeu
        function restartGame() {
            score = 0;
            isGameOver = false;
            document.getElementById('score').textContent = score;
            document.getElementById('progress-bar').style.width = '0%';
            document.querySelector('.game-over').style.display = 'none';
            
            // Nettoyage des étoiles et astéroïdes
            stars.forEach(star => {
                if (star.parentNode === gameContainer) {
                    gameContainer.removeChild(star);
                }
            });
            asteroids.forEach(asteroid => {
                if (asteroid.parentNode === gameContainer) {
                    gameContainer.removeChild(asteroid);
                }
            });
            stars = [];
            asteroids = [];
            
            // Réinitialisation de la position du joueur
            playerPos = { x: 400, y: 300 };
            targetPos = { x: 400, y: 300 };
            playerEl.style.left = '400px';
            playerEl.style.top = '300px';
        }

        // Création du fond étoilé
        function createStarryBackground() {
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'background-star';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                gameContainer.appendChild(star);
            }
        }

        // Boucle de jeu principale
        function gameLoop() {
            if (!isGameOver) {
                updatePlayerPosition();
                updateAsteroids();
                checkCollisions();
            }
            requestAnimationFrame(gameLoop);
        }

        // Initialisation
        playerEl.style.left = '400px';
        playerEl.style.top = '300px';
        createStarryBackground();
        gameContainer.addEventListener('mousemove', movePlayer);
        gameLoop();

        // Création périodique d'étoiles et d'astéroïdes
        setInterval(createStar, 1000);
        setInterval(createAsteroid, 2000);
    </script>
</body>
</html>
