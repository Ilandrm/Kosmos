<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chasse aux Aliens</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            min-height: 100vh;
            color: white;
            background: 
                radial-gradient(circle at 50% 50%, rgba(0, 41, 102, 0.3) 0%, transparent 100%),
                radial-gradient(circle at 20% 30%, rgba(128, 0, 255, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 209, 255, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 60% 40%, rgba(238, 130, 238, 0.3) 0%, transparent 60%),
                linear-gradient(45deg, #000428 0%, #140028 30%, #1B004B 70%, #002447 100%);
            position: relative;
            overflow: hidden;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle 3s infinite;
        }

        .shooting-star {
            position: fixed;
            width: 2px;
            height: 200px;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(-45deg);
            opacity: 0;
            z-index: 1;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        @keyframes shooting-star {
            0% {
                transform: translateX(-100vw) translateY(100vh) rotate(-45deg);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateX(100vw) translateY(-100vh) rotate(-45deg);
                opacity: 0;
            }
        }

        #alien-game {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        #alien-score {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            color: #00d1ff;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px rgba(0, 209, 255, 0.5);
            font-weight: 700;
            background: rgba(0, 20, 50, 0.8);
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid #00d1ff;
        }

        .alien {
            position: absolute;
            width: 300px;
            height: 180px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .alien svg {
            filter: drop-shadow(0 0 10px rgba(0, 209, 255, 0.5));
            width: 100%;
            height: 100%;
        }

        .victory-message {
            text-align: center;
            padding: 20px;
            background: rgba(0, 20, 50, 0.8);
            border-radius: 10px;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 300px;
            font-family: 'Orbitron', sans-serif;
            border: 2px solid #00d1ff;
        }

        button {
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(45deg, #003a66, #00588f);
            border: 2px solid #00d1ff;
            color: white;
            padding: 1rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            margin-top: 1rem;
            transition: all 0.3s;
        }

        button:hover {
            background: #00d1ff;
            color: black;
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div id="alien-game">
        <div id="alien-score">Aliens violets touchés: 0/15</div>
    </div>

    <script>
        // Création des étoiles
        function createStars() {
            const starsContainer = document.querySelector('.stars');
            const starCount = 400;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                const size = 0.5 + Math.random() * 3;
                const opacity = 0.4 + Math.random() * 0.6;

                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.opacity = opacity;
                star.style.animationDelay = `-${Math.random() * 10}s`;

                starsContainer.appendChild(star);
            }
        }

        // Création des étoiles filantes
        function createShootingStars() {
            function addShootingStar() {
                const shootingStar = document.createElement('div');
                shootingStar.classList.add('shooting-star');
                
                shootingStar.style.left = `${Math.random() * 100}%`;
                shootingStar.style.top = `${Math.random() * 100}%`;
                
                shootingStar.style.animationDuration = `${2 + Math.random() * 3}s`;
                shootingStar.style.animationDelay = `${Math.random() * 5}s`;
                shootingStar.style.animation = 'shooting-star 5s linear infinite';

                document.body.appendChild(shootingStar);

                setTimeout(() => {
                    document.body.removeChild(shootingStar);
                }, 5000);
            }

            setInterval(addShootingStar, 3000);
            setInterval(addShootingStar, 4500);
        }

        // Fonction pour créer un vaisseau alien
        function createAlienShip(isViolet) {
            const alien = document.createElement('div');
            alien.className = 'alien';
            alien.dataset.type = isViolet ? 'purple' : 'green';

            const skinColor = isViolet ? 
                'stop-color="#b090ff"/><stop offset="80%" stop-color="#6040c0"' :
                'stop-color="#90ff90"/><stop offset="80%" stop-color="#40c040"';
            const strokeColor = isViolet ? '#4020a0' : '#208020';

            alien.innerHTML = `
                <svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
                    <ellipse cx="100" cy="110" rx="50" ry="10" fill="rgba(0,0,0,0.2)"/>
                    <path d="M30 60 C30 40, 170 40, 170 60 C170 80, 30 80, 30 60" 
                          fill="url(#metallic)" stroke="#666" stroke-width="2"/>
                    <defs>
                        <radialGradient id="metallic">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="70%" stop-color="#a0a0a0"/>
                            <stop offset="100%" stop-color="#808080"/>
                        </radialGradient>
                        <radialGradient id="dome">
                            <stop offset="0%" stop-color="#b0c0ff"/>
                            <stop offset="80%" stop-color="#8090c0"/>
                        </radialGradient>
                        <radialGradient id="alienSkin${isViolet ? 'Purple' : 'Green'}">
                            <stop offset="0%" ${skinColor}/>
                        </radialGradient>
                    </defs>
                    <ellipse cx="100" cy="45" rx="30" ry="25" fill="url(#dome)" stroke="#666" stroke-width="2"/>
                    <g transform="translate(100,45) scale(0.5)">
                        <path d="M-20 -20 Q0 -35, 20 -20 Q25 -10, 20 5 Q0 20, -20 5 Q-25 -10, -20 -20" 
                              fill="url(#alienSkin${isViolet ? 'Purple' : 'Green'})" stroke="${strokeColor}" stroke-width="2"/>
                        <ellipse cx="-8" cy="-10" rx="5" ry="8" fill="black"/>
                        <ellipse cx="8" cy="-10" rx="5" ry="8" fill="black"/>
                        <circle cx="-8" cy="-12" r="2" fill="white"/>
                        <circle cx="8" cy="-12" r="2" fill="white"/>
                    </g>
                    <g>
                        <circle cx="60" cy="60" r="5" fill="#40c0ff"/>
                        <circle cx="90" cy="60" r="5" fill="#40c0ff"/>
                        <circle cx="120" cy="60" r="5" fill="#40c0ff"/>
                        <circle cx="150" cy="60" r="5" fill="#40c0ff"/>
                    </g>
                    <g stroke="#666" stroke-width="2">
                        <line x1="45" y1="70" x2="35" y2="85" stroke-linecap="round"/>
                        <line x1="155" y1="70" x2="165" y2="85" stroke-linecap="round"/>
                    </g>
                </svg>
            `;

            return alien;
        }

        let alienScore = 0;
        let alienTimeouts = [];

        function clearAllTimeouts() {
            alienTimeouts.forEach(timeout => clearTimeout(timeout));
            alienTimeouts = [];
        }

        function moveAlien(alien) {
            const maxX = window.innerWidth - 300;
            const maxY = window.innerHeight - 180;
            
            alien.style.left = Math.random() * maxX + 'px';
            alien.style.top = Math.random() * maxY + 'px';
            
            const size = 100 + Math.random() * 40;
            alien.style.width = size + 'px';
            alien.style.height = size + 'px';
            
            const timeout = setTimeout(() => moveAlien(alien), 1200 + Math.random() * 800);
            alienTimeouts.push(timeout);
        }

        function hitAlien(event) {
            const alien = event.currentTarget;
            if (alien.dataset.type === 'purple') {
                alienScore++;
                updateAlienScore();
                
                if (alienScore >= 15) {
                    showVictoryMessage();
                }
            }
            moveAlien(alien);
        }

        function updateAlienScore() {
            document.getElementById('alien-score').textContent = `Aliens violets touchés: ${alienScore}/15`;
        }

        function showVictoryMessage() {
            clearAllTimeouts();
            document.querySelectorAll('.alien').forEach(alien => alien.style.display = 'none');
            
            const victoryMessage = document.createElement('div');
            victoryMessage.className = 'victory-message';
            victoryMessage.innerHTML = `
                <h2>Félicitations !</h2>
                <p>Vous avez capturé tous les aliens violets !</p>
                <button onclick="restartGame()">Rejouer</button>
            `;
            document.body.appendChild(victoryMessage);
        }

        function startGame() {
            const game = document.getElementById('alien-game');
            
            // Créer 1 vaisseau violet
            const purpleAlien = createAlienShip(true);
            game.appendChild(purpleAlien);
            purpleAlien.addEventListener('click', hitAlien);
            moveAlien(purpleAlien);

            // Créer 3 vaisseaux verts
            for (let i = 0; i < 3; i++) {
                const greenAlien = createAlienShip(false);
                game.appendChild(greenAlien);
                greenAlien.addEventListener('click', hitAlien);
                moveAlien(greenAlien);
            }
        }

        function restartGame() {
            const victoryMessage = document.querySelector('.victory-message');
            if (victoryMessage) {
                victoryMessage.remove();
            }
            document.querySelectorAll('.alien').forEach(alien => alien.remove());
            clearAllTimeouts();
            alienScore = 0;
            updateAlienScore();
            startGame();
        }

        // Initialisation
        createStars();
        createShootingStars();
        startGame();
    </script>
</body>
</html>
