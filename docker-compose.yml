version: '3.8'

services:
  kosmos-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kosmos-app
    ports:
      - "8080:80"
    restart: unless-stopped
    # Volumes optionnels pour le développement
    # volumes:
    #   - ./src:/app/src

  # Service de développement optionnel
  # Service de développement - commentez les lignes ci-dessous si vous ne voulez pas l'utiliser
  kosmos-dev:
    build:
      context: .
    container_name: kosmos-dev
    ports:
      - "5173:5173"
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development

# Définition des volumes nommés
volumes:
  node_modules:
