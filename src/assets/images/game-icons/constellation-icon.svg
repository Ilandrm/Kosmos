<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#AAAAFF"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="60" fill="#080820" stroke="#333366" stroke-width="4"/>
  
  <!-- Big Dipper -->
  <circle cx="30" cy="30" r="4" fill="url(#starGrad)" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="45" cy="35" r="4" fill="url(#starGrad)" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="60" cy="40" r="4" fill="url(#starGrad)" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="70" cy="55" r="4" fill="url(#starGrad)" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="85" cy="70" r="4" fill="url(#starGrad)" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="100" cy="75" r="4" fill="url(#starGrad)" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="90" cy="90" r="4" fill="url(#starGrad)" stroke="#FFFFFF" stroke-width="1"/>
  
  <!-- Constellation lines -->
  <line x1="30" y1="30" x2="45" y2="35" stroke="#AAAAFF" stroke-width="1" opacity="0.7"/>
  <line x1="45" y1="35" x2="60" y2="40" stroke="#AAAAFF" stroke-width="1" opacity="0.7"/>
  <line x1="60" y1="40" x2="70" y2="55" stroke="#AAAAFF" stroke-width="1" opacity="0.7"/>
  <line x1="70" y1="55" x2="85" y2="70" stroke="#AAAAFF" stroke-width="1" opacity="0.7"/>
  <line x1="85" y1="70" x2="100" y2="75" stroke="#AAAAFF" stroke-width="1" opacity="0.7"/>
  <line x1="100" y1="75" x2="90" y2="90" stroke="#AAAAFF" stroke-width="1" opacity="0.7"/>
  
  <!-- Other stars -->
  <circle cx="25" cy="80" r="2" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="40" cy="95" r="2" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="55" cy="75" r="2" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="75" cy="25" r="2" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="95" cy="45" r="2" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="105" cy="25" r="2" fill="#FFFFFF" opacity="0.7"/>
</svg>
